name: ohdit

services:
  www:
    build:
      context: ./www
      dockerfile: Dockerfile
    ports:
      - "1337:4321"
    volumes:
      - ./www:/app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: dev
    ports:
      - "1339:1339"
    volumes:
      - ./app:/app
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "1338:8000"
    volumes:
      - ./api:/var/www/html
    environment:
      - APP_ENV=dev
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
    depends_on:
      - database
      - redis

  database:
    image: postgres:17.5-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data: