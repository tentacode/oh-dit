name: ohdit

services:
  www:
    build:
      context: ./www
      dockerfile: Dockerfile
    ports:
      - "1337:4321"
    volumes:
      - ./www:/app
      - /app/node_modules
      - /app/.astro
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - database

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "1338:8000"
    volumes:
      - ./api:/var/www/html
    environment:
      - APP_ENV=dev
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
    depends_on:
      - database

  database:
    image: postgres:17.5-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
