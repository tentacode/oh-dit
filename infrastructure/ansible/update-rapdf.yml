---
- name: Update RAPDF data in resources directory
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    repo_url: "git@github.com:Oh-Dit/ReferentielAccessibilitePDF.git"
    import_directory: "{{ playbook_dir }}/../../api/var/data"

  tasks:
    - name: Ensure resources directory exists
      ansible.builtin.file:
        path: "{{ import_directory }}"
        state: directory
        mode: '0755'

    - name: Clone or update RAPDF repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ import_directory }}/rapdf-git"
        version: markdown-to-structured-json
        force: yes
        accept_hostkey: yes

    - name: Remove .git directory from cloned repository
      ansible.builtin.file:
        path: "{{ import_directory }}/rapdf-git/.git"
        state: absent