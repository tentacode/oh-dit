security:
    password_hashers:
        App\Features\Authentication\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Features\Authentication\Entity\User
                property: email
        secured_link_provider:
            id: App\Features\SecuredLinkReport\Security\SecuredLinkUserProvider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 10
                interval: '15 minutes'

        secured_link:
            pattern: ^/api/secured-link
            stateless: true
            provider: secured_link_provider
            custom_authenticators:
                - App\Features\SecuredLinkReport\Security\SecuredLinkAuthenticator

        api:
            pattern:   ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot_password, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset_password, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/healthcheck, roles: PUBLIC_ACCESS }
        - { path: ^/api/newsletter, roles: PUBLIC_ACCESS }
        - { path: ^/api/secured-link/.+/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/secured-link, roles: ROLE_SECURED_LINK_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
