nelmio_cors:
    defaults:
        origin_regex: true
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600

when@dev:
    nelmio_cors:
        paths:
            '^/api/':
                allow_origin: ['*']

when@prod:
    nelmio_cors:
        paths:
            '^/api/':
                allow_origin: ['https://ohdit.com', 'https://www.ohdit.com', 'https://app.ohdit.com']
